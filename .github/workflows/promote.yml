name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.13)"
        required: true
      channel:
        description: "Release channel"
        required: true
        default: "alpha"

env:
  CONTRIB_DOCKER_USR: ${{ secrets.CONTRIB_DOCKER_USR }}

jobs:
  promote-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Login to Docker
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        if: env.CONTRIB_DOCKER_USR != ''
        with:
          username: ${{ secrets.CONTRIB_DOCKER_USR }}
          password: ${{ secrets.CONTRIB_DOCKER_PSW }}

      - name: Promote Artifacts in S3 and Docker Hub
        if: env.CONTRIB_DOCKER_USR != ''
        run: make -j2 promote BRANCH_NAME=${GITHUB_REF##*/}
        env:
          VERSION: ${{ github.event.inputs.version }}
          CHANNEL: ${{ github.event.inputs.channel }}
